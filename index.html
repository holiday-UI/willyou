<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Question for Marylyne 💌</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffd1ff 100%);
      overflow: hidden;
      padding: 24px;
    }

    h1 {
      font-size: clamp(1.8rem, 6vw, 3rem);
      color: #7a2048;
      margin-bottom: 8px;
      text-shadow: 0 2px 6px rgba(255, 255, 255, 0.5);
    }

    .heart {
      font-size: clamp(3rem, 12vw, 5rem);
      margin-bottom: 16px;
      animation: beat 1.2s ease-in-out infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .buttons {
      margin-top: 40px;
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, font-size 0.15s ease, padding 0.15s ease;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
    }

    #yes {
      background: #ff4d6d;
      color: white;
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      padding: 16px 40px;
    }

    #yes:hover { transform: scale(1.08); }

    #no {
      background: #ffffff;
      color: #7a2048;
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      padding: 16px 40px;
    }

    #no.dodging {
      position: fixed;
    }

    .result {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .result h1 { color: #7a2048; }

    .result .big-heart {
      font-size: clamp(4rem, 18vw, 8rem);
      animation: beat 0.8s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="ask">
    <div class="heart">💖</div>
    <h1>Marylyne, would you go on a date with me?</h1>
    <p style="color:#7a2048; margin-top:8px; font-size: clamp(1rem, 4vw, 1.3rem);">— David</p>
    <div class="buttons">
      <button id="yes">Yes 😊</button>
      <button id="no">No</button>
    </div>
  </div>

  <div class="result" id="result">
    <div class="big-heart">🥰</div>
    <h1>Yay! You just made my day, Marylyne! 💕</h1>
    <p style="color:#7a2048; font-size: clamp(1rem, 4vw, 1.3rem);">I can't wait. See you soon. 💌<br/>— David</p>
  </div>

  <script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const ask = document.getElementById('ask');
    const result = document.getElementById('result');

    // Private push-notification topic (hard to guess).
    const NTFY_TOPIC = 'marylyne-yes-k7m2p9qzx4';

    // The No button gets funnier and more desperate each time it runs away.
    const noTexts = [
      'No',
      'No?',
      'Are you sure?',
      'Really sure?',
      'Think again! 🤔',
      'Pleeease? 🥺',
      'Don’t do this 😭',
      'You can’t catch me 😜',
      'Just say yes! 💘',
      'I’ll cry 😢',
      '💔'
    ];
    let dodgeCount = 0;

    function moveNoButton() {
      if (!noBtn.classList.contains('dodging')) {
        noBtn.classList.add('dodging');
      }

      // Update the funny text.
      dodgeCount++;
      const idx = Math.min(dodgeCount, noTexts.length - 1);
      noBtn.textContent = noTexts[idx];

      // Shrink No, grow Yes (within limits) to tempt her.
      const noScale = Math.max(0.55, 1 - dodgeCount * 0.06);
      noBtn.style.transform = 'scale(' + noScale + ')';
      const yesScale = Math.min(1.6, 1 + dodgeCount * 0.05);
      yesBtn.style.transform = 'scale(' + yesScale + ')';

      // Jump to a random spot on screen.
      const btnW = noBtn.offsetWidth;
      const btnH = noBtn.offsetHeight;
      const maxX = window.innerWidth - btnW - 16;
      const maxY = window.innerHeight - btnH - 16;
      const newX = Math.max(16, Math.floor(Math.random() * maxX));
      const newY = Math.max(16, Math.floor(Math.random() * maxY));
      noBtn.style.left = newX + 'px';
      noBtn.style.top = newY + 'px';
    }

    // Desktop: dodge on hover.
    noBtn.addEventListener('mouseover', moveNoButton);

    // Mobile + fallback: dodge on any tap attempt.
    noBtn.addEventListener('touchstart', function (e) {
      e.preventDefault();
      moveNoButton();
    }, { passive: false });

    noBtn.addEventListener('click', function (e) {
      e.preventDefault();
      moveNoButton();
    });

    // Yes: notify David, then show the happy result.
    yesBtn.addEventListener('click', function () {
      // Fire-and-forget push notification (don't block the UI if it fails).
      try {
        fetch('https://ntfy.sh/' + NTFY_TOPIC, {
          method: 'POST',
          body: 'Marylyne said YES! 💕',
          headers: {
            'Title': 'She said YES! 🎉',
            'Tags': 'tada,heart',
            'Priority': 'high'
          }
        }).catch(function () {});
      } catch (e) {}

      ask.style.display = 'none';
      result.style.display = 'flex';
    });
  </script>
</body>
</html>
