<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David's Live Dashboard 💘</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #14111a;
      color: #f3eef7;
      min-height: 100vh;
      padding: 20px;
    }
    .wrap { max-width: 640px; margin: 0 auto; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    header h1 { font-size: 1.4rem; color: #ff8fb0; }
    .conn { font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; background: #2a2333; }
    .conn.online { background: #1f4d2e; color: #7fffa0; }
    .conn.offline { background: #4d1f1f; color: #ff9a9a; }

    /* Login gate */
    #gate { max-width: 340px; margin: 80px auto; text-align: center; }
    #gate input {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      font-size: 1.1rem; margin: 16px 0; text-align: center;
    }
    #gate button {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: #ff4d6d; color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer;
    }
    #gate .err { color: #ff9a9a; font-size: 0.9rem; min-height: 1.2em; }

    #app { display: none; }

    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    .card {
      background: #211b2b; border-radius: 16px; padding: 18px;
      border: 1px solid #322a40;
    }
    .card .label { font-size: 0.8rem; color: #b3a6c7; text-transform: uppercase; letter-spacing: 0.05em; }
    .card .value { font-size: 1.5rem; font-weight: 700; margin-top: 6px; }
    .card .value small { font-size: 0.85rem; color: #9d8fb3; font-weight: 400; }
    .card.full { grid-column: 1 / -1; }

    .pending { color: #6f6383; }
    .done { color: #7fffa0; }

    .yes-banner {
      grid-column: 1 / -1; text-align: center; padding: 24px;
      background: linear-gradient(135deg, #ff4d6d, #ff9a3c);
      border-radius: 16px; display: none;
    }
    .yes-banner.show { display: block; animation: pop 0.5s ease; }
    .yes-banner h2 { font-size: 1.8rem; }
    @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .dodge-num { font-size: 2.6rem; }

    .log { background: #1b1623; border-radius: 16px; padding: 16px; border: 1px solid #322a40; }
    .log h3 { font-size: 0.9rem; color: #b3a6c7; margin-bottom: 12px; }
    .log ul { list-style: none; }
    .log li { padding: 8px 0; border-bottom: 1px solid #2a2333; font-size: 0.95rem; display: flex; justify-content: space-between; gap: 12px; }
    .log li:last-child { border-bottom: none; }
    .log li .t { color: #8a7da0; font-size: 0.8rem; white-space: nowrap; }
    .log .empty { color: #6f6383; font-style: italic; }

    .reset { margin-top: 18px; }
    .reset button {
      background: #2a2333; color: #b3a6c7; border: 1px solid #3a3148;
      padding: 10px 18px; border-radius: 12px; cursor: pointer; font-size: 0.9rem;
    }
    .reset button:hover { background: #322a40; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Passcode gate -->
    <div id="gate">
      <div style="font-size:3rem">💘</div>
      <h1 style="color:#ff8fb0;margin-top:10px">David's Dashboard</h1>
      <input id="code" type="password" placeholder="Enter passcode" autocomplete="off" />
      <div class="err" id="gateErr"></div>
      <button id="gateBtn">Unlock</button>
    </div>

    <!-- Dashboard -->
    <div id="app">
      <header>
        <h1>💘 Marylyne — Live</h1>
        <span class="conn offline" id="conn">connecting…</span>
      </header>

      <div class="cards">
        <div class="yes-banner" id="yesBanner">
          <h2>🎉 SHE SAID YES! 💕</h2>
          <div id="yesWhen" style="margin-top:8px;opacity:0.9"></div>
        </div>

        <div class="card">
          <div class="label">Entered</div>
          <div class="value pending" id="entered">Not yet</div>
        </div>
        <div class="card">
          <div class="label">Viewing question</div>
          <div class="value pending" id="viewing">Not yet</div>
        </div>
        <div class="card">
          <div class="label">"No" dodges</div>
          <div class="value dodge-num" id="dodges">0</div>
        </div>
        <div class="card">
          <div class="label">Answer</div>
          <div class="value pending" id="answer">Waiting…</div>
        </div>
      </div>

      <div class="log">
        <h3>Live activity</h3>
        <ul id="logList"><li class="empty">No activity yet — waiting for Marylyne…</li></ul>
      </div>

      <div class="reset">
        <button id="resetBtn">🔄 Reset session</button>
      </div>
    </div>
  </div>

  <script>
    const gate = document.getElementById('gate');
    const app = document.getElementById('app');
    const codeInput = document.getElementById('code');
    const gateErr = document.getElementById('gateErr');
    const conn = document.getElementById('conn');

    let ws = null;
    let code = '';

    function fmtTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
      ws = new WebSocket(proto + location.host);
      ws.addEventListener('open', function () {
        ws.send(JSON.stringify({ type: 'hello', role: 'david', code: code }));
      });
      ws.addEventListener('message', function (ev) {
        let msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }

        if (msg.type === 'auth') {
          if (msg.ok) {
            gate.style.display = 'none';
            app.style.display = 'block';
            conn.textContent = 'live';
            conn.className = 'conn online';
            try { localStorage.setItem('davidCode', code); } catch (e) {}
          } else {
            gateErr.textContent = 'Wrong passcode.';
            try { localStorage.removeItem('davidCode'); } catch (e) {}
            ws.close();
          }
          return;
        }
        if (msg.type === 'state') render(msg.state);
      });
      ws.addEventListener('close', function () {
        if (app.style.display === 'block') {
          conn.textContent = 'reconnecting…';
          conn.className = 'conn offline';
          setTimeout(connect, 2000);
        }
      });
    }

    function render(s) {
      const entered = document.getElementById('entered');
      entered.textContent = s.entered ? 'Yes' : 'Not yet';
      entered.className = 'value ' + (s.entered ? 'done' : 'pending');
      if (s.entered) entered.innerHTML = 'Yes <small>' + fmtTime(s.enteredAt) + '</small>';

      const viewing = document.getElementById('viewing');
      viewing.textContent = s.viewing ? 'Yes' : 'Not yet';
      viewing.className = 'value ' + (s.viewing ? 'done' : 'pending');
      if (s.viewing) viewing.innerHTML = 'Yes <small>' + fmtTime(s.viewingAt) + '</small>';

      document.getElementById('dodges').textContent = s.dodgeCount;

      const answer = document.getElementById('answer');
      if (s.answered === 'yes') {
        answer.textContent = 'YES 💕';
        answer.className = 'value done';
        const banner = document.getElementById('yesBanner');
        banner.classList.add('show');
        document.getElementById('yesWhen').textContent = 'at ' + fmtTime(s.answeredAt);
      } else {
        answer.textContent = 'Waiting…';
        answer.className = 'value pending';
        document.getElementById('yesBanner').classList.remove('show');
      }

      const list = document.getElementById('logList');
      if (!s.log || s.log.length === 0) {
        list.innerHTML = '<li class="empty">No activity yet — waiting for Marylyne…</li>';
      } else {
        list.innerHTML = s.log.slice().reverse().map(function (e) {
          return '<li><span>' + e.text + '</span><span class="t">' + fmtTime(e.at) + '</span></li>';
        }).join('');
      }
    }

    function unlock() {
      code = codeInput.value.trim();
      if (!code) { gateErr.textContent = 'Enter the passcode.'; return; }
      gateErr.textContent = '';
      connect();
    }

    document.getElementById('gateBtn').addEventListener('click', unlock);
    codeInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });

    document.getElementById('resetBtn').addEventListener('click', function () {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'reset' }));
    });

    // Remember the passcode so David doesn't retype it each visit.
    try {
      const saved = localStorage.getItem('davidCode');
      if (saved) { code = saved; connect(); }
    } catch (e) {}
  </script>
</body>
</html>
