<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💘 David's Love Dashboard 💘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-3: #ff9ec7;
      --pink-4: #ff6fae;
      --pink-5: #ff4d94;
      --rose: #c2185b;
      --plum: #8a2c63;
      --card: rgba(255, 255, 255, 0.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(160deg, #ffd6e8 0%, #ffb6d5 50%, #ff9ec7 100%);
      min-height: 100vh;
      padding: 20px;
      color: var(--plum);
      position: relative;
      overflow-x: hidden;
    }

    /* Floating hearts background */
    .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .hearts span {
      position: absolute; bottom: -40px; opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.6) rotate(0); opacity: 0; }
      10% { opacity: 0.7; } 90% { opacity: 0.5; }
      100% { transform: translateY(-110vh) scale(1.1) rotate(35deg); opacity: 0; }
    }

    .wrap { max-width: 660px; margin: 0 auto; position: relative; z-index: 1; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 12px; flex-wrap: wrap; }
    header h1 { font-family: 'Pacifico', cursive; font-weight: 400; font-size: 1.7rem; color: var(--rose); text-shadow: 0 2px 0 #fff; }
    .conn { font-size: 0.8rem; padding: 5px 14px; border-radius: 999px; background: #fff; color: var(--plum); font-weight: 700; box-shadow: 0 4px 12px rgba(194,24,91,0.15); }
    .conn.online { background: linear-gradient(135deg, #b8f5c8, #7fe7a0); color: #1d6b3a; }
    .conn.offline { background: #ffd9d9; color: #b03a3a; }

    /* Login gate */
    #gate {
      max-width: 360px; margin: 70px auto; text-align: center;
      background: var(--card); backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.7); border-radius: 30px; padding: 38px 28px;
      box-shadow: 0 18px 50px rgba(194, 24, 91, 0.25);
    }
    #gate .big { font-size: 3.2rem; filter: drop-shadow(0 6px 10px rgba(194,24,91,0.3)); }
    #gate h1 { font-family: 'Pacifico', cursive; font-weight: 400; color: var(--rose); margin-top: 8px; font-size: 1.7rem; }
    #gate p { color: var(--plum); font-weight: 600; margin-top: 6px; font-size: 0.95rem; }
    #gate input {
      width: 100%; padding: 14px; border-radius: 16px; border: 2px solid var(--pink-3);
      font-size: 1.1rem; margin: 18px 0 8px; text-align: center; font-family: 'Quicksand', sans-serif;
      background: #fff; color: var(--plum);
    }
    #gate input:focus { outline: none; border-color: var(--pink-5); }
    #gate button {
      width: 100%; padding: 14px; border-radius: 16px; border: none; margin-top: 8px;
      background: linear-gradient(135deg, var(--pink-4), var(--pink-5)); color: white;
      font-size: 1.1rem; font-weight: 700; cursor: pointer; font-family: 'Quicksand', sans-serif;
      box-shadow: 0 10px 22px rgba(255, 77, 148, 0.45);
    }
    #gate .err { color: #c0392b; font-size: 0.9rem; min-height: 1.2em; margin-top: 8px; font-weight: 600; }

    #app { display: none; }

    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    .card {
      background: var(--card); backdrop-filter: blur(8px);
      border-radius: 22px; padding: 18px 20px; border: 2px solid rgba(255,255,255,0.7);
      box-shadow: 0 10px 26px rgba(194, 24, 91, 0.15);
    }
    .card .label { font-size: 0.78rem; color: var(--rose); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
    .card .value { font-size: 1.5rem; font-weight: 700; margin-top: 6px; color: var(--plum); }
    .card .value small { font-size: 0.85rem; color: #b03a76; font-weight: 500; }

    .pending { color: #c79ab3; }
    .done { color: #1d6b3a; }

    .yes-banner {
      grid-column: 1 / -1; text-align: center; padding: 26px;
      background: linear-gradient(135deg, var(--pink-4), #ff8a3c);
      border-radius: 22px; display: none; color: #fff;
      box-shadow: 0 14px 34px rgba(255, 77, 148, 0.5);
    }
    .yes-banner.show { display: block; animation: pop 0.5s ease; }
    .yes-banner h2 { font-family: 'Pacifico', cursive; font-weight: 400; font-size: 2rem; text-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .dodge-num { font-size: 2.6rem; color: var(--rose); }

    .log {
      background: var(--card); backdrop-filter: blur(8px);
      border-radius: 22px; padding: 18px 20px; border: 2px solid rgba(255,255,255,0.7);
      box-shadow: 0 10px 26px rgba(194, 24, 91, 0.15);
    }
    .log h3 { font-size: 0.9rem; color: var(--rose); margin-bottom: 12px; font-weight: 700; }
    .log ul { list-style: none; }
    .log li { padding: 9px 0; border-bottom: 1px dashed rgba(194,24,91,0.2); font-size: 0.97rem; display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
    .log li:last-child { border-bottom: none; }
    .log li .t { color: #b03a76; font-size: 0.8rem; white-space: nowrap; font-weight: 500; }
    .log .empty { color: #c79ab3; font-style: italic; font-weight: 500; }

    .reset { margin-top: 18px; text-align: center; }
    .reset button {
      background: #fff; color: var(--rose); border: 2px solid var(--pink-3);
      padding: 11px 22px; border-radius: 999px; cursor: pointer; font-size: 0.92rem;
      font-family: 'Quicksand', sans-serif; font-weight: 700;
      box-shadow: 0 6px 16px rgba(194,24,91,0.15);
    }
    .reset button:hover { background: var(--pink-3); color: #fff; }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>
  <div class="wrap">
    <!-- Passcode gate -->
    <div id="gate">
      <div class="big">💘</div>
      <h1>David’s Love Dashboard</h1>
      <p>Pssst… enter your secret word 💕</p>
      <input id="code" type="password" placeholder="secret passcode" autocomplete="off" />
      <div class="err" id="gateErr"></div>
      <button id="gateBtn">Unlock 💌</button>
    </div>

    <!-- Dashboard -->
    <div id="app">
      <header>
        <h1>💕 Marylyne — Live 💕</h1>
        <span class="conn offline" id="conn">connecting…</span>
      </header>

      <div class="cards">
        <div class="yes-banner" id="yesBanner">
          <h2>🎉 SHE SAID YES! 💕</h2>
          <div id="yesWhen" style="margin-top:8px;opacity:0.95;font-weight:600"></div>
        </div>

        <div class="card">
          <div class="label">💖 Entered</div>
          <div class="value pending" id="entered">Not yet</div>
        </div>
        <div class="card">
          <div class="label">👀 Viewing question</div>
          <div class="value pending" id="viewing">Not yet</div>
        </div>
        <div class="card">
          <div class="label">🏃 "No" dodges</div>
          <div class="value dodge-num" id="dodges">0</div>
        </div>
        <div class="card">
          <div class="label">💌 Answer</div>
          <div class="value pending" id="answer">Waiting…</div>
        </div>
      </div>

      <div class="log">
        <h3>💞 Live activity</h3>
        <ul id="logList"><li class="empty">No activity yet — waiting for Marylyne… 🌸</li></ul>
      </div>

      <div class="reset">
        <button id="resetBtn">🔄 Reset session</button>
      </div>
    </div>
  </div>

  <script>
    // Floating hearts background
    (function makeHearts() {
      const container = document.getElementById('hearts');
      const emojis = ['💕','💖','💗','💓','🌸','💘'];
      for (let i = 0; i < 20; i++) {
        const s = document.createElement('span');
        s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        s.style.left = Math.random() * 100 + 'vw';
        s.style.fontSize = (12 + Math.random() * 22) + 'px';
        const dur = 8 + Math.random() * 9;
        s.style.animationDuration = dur + 's';
        s.style.animationDelay = (-Math.random() * dur) + 's';
        container.appendChild(s);
      }
    })();

    const gate = document.getElementById('gate');
    const app = document.getElementById('app');
    const codeInput = document.getElementById('code');
    const gateErr = document.getElementById('gateErr');
    const conn = document.getElementById('conn');

    let ws = null;
    let code = '';

    function fmtTime(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
      ws = new WebSocket(proto + location.host);
      ws.addEventListener('open', function () {
        ws.send(JSON.stringify({ type: 'hello', role: 'david', code: code }));
      });
      ws.addEventListener('message', function (ev) {
        let msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }

        if (msg.type === 'auth') {
          if (msg.ok) {
            gate.style.display = 'none';
            app.style.display = 'block';
            conn.textContent = '💚 live';
            conn.className = 'conn online';
            try { localStorage.setItem('davidCode', code); } catch (e) {}
          } else {
            gateErr.textContent = 'Oops, wrong secret word 🙈';
            try { localStorage.removeItem('davidCode'); } catch (e) {}
            ws.close();
          }
          return;
        }
        if (msg.type === 'state') render(msg.state);
      });
      ws.addEventListener('close', function () {
        if (app.style.display === 'block') {
          conn.textContent = 'reconnecting…';
          conn.className = 'conn offline';
          setTimeout(connect, 2000);
        }
      });
    }

    function render(s) {
      const entered = document.getElementById('entered');
      entered.className = 'value ' + (s.entered ? 'done' : 'pending');
      entered.innerHTML = s.entered ? 'Yes 💕 <small>' + fmtTime(s.enteredAt) + '</small>' : 'Not yet';

      const viewing = document.getElementById('viewing');
      viewing.className = 'value ' + (s.viewing ? 'done' : 'pending');
      viewing.innerHTML = s.viewing ? 'Yes 👀 <small>' + fmtTime(s.viewingAt) + '</small>' : 'Not yet';

      document.getElementById('dodges').textContent = s.dodgeCount;

      const answer = document.getElementById('answer');
      if (s.answered === 'yes') {
        answer.textContent = 'YES 💕';
        answer.className = 'value done';
        const banner = document.getElementById('yesBanner');
        banner.classList.add('show');
        document.getElementById('yesWhen').textContent = 'at ' + fmtTime(s.answeredAt);
      } else {
        answer.textContent = 'Waiting…';
        answer.className = 'value pending';
        document.getElementById('yesBanner').classList.remove('show');
      }

      const list = document.getElementById('logList');
      if (!s.log || s.log.length === 0) {
        list.innerHTML = '<li class="empty">No activity yet — waiting for Marylyne… 🌸</li>';
      } else {
        list.innerHTML = s.log.slice().reverse().map(function (e) {
          return '<li><span>' + e.text + '</span><span class="t">' + fmtTime(e.at) + '</span></li>';
        }).join('');
      }
    }

    function unlock() {
      code = codeInput.value.trim();
      if (!code) { gateErr.textContent = 'Type your secret word 💗'; return; }
      gateErr.textContent = '';
      connect();
    }

    document.getElementById('gateBtn').addEventListener('click', unlock);
    codeInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
    document.getElementById('resetBtn').addEventListener('click', function () {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'reset' }));
    });

    try {
      const saved = localStorage.getItem('davidCode');
      if (saved) { code = saved; connect(); }
    } catch (e) {}
  </script>
</body>
</html>
